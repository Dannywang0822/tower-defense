<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#1a1610" />
  <title>路卫 — Coinpath Defense</title>
  <link rel="stylesheet" href="styles.css?v=14" />
</head>
<body>
  <div id="app">
    <header id="hud">
      <div class="hud-stats">
        <div class="hud-item" title="生命">
          <span class="hud-icon">🛡</span>
          <span id="hud-lives">20</span>
        </div>
        <div class="hud-item" title="金币">
          <span class="hud-icon">🪙</span>
          <span id="hud-gold">120</span>
        </div>
        <div class="hud-item" title="关卡">
          <span class="hud-icon">🏛</span>
          <span id="hud-level">1/1000</span>
        </div>
        <div class="hud-item" title="波次">
          <span class="hud-icon">🧟</span>
          <span id="hud-wave">0/30</span>
        </div>
        <div class="hud-item" title="难度" id="hud-diff-wrap">
          <span class="hud-icon">⚔</span>
          <span id="hud-diff">巡城</span>
        </div>
        <div class="hud-item hud-status" id="hud-status">选关中</div>
      </div>
      <div class="hud-tools">
        <div class="speed-seg" id="speed-btns" role="group" aria-label="游戏速度">
          <button type="button" class="speed-btn active" data-speed="1">1×</button>
          <button type="button" class="speed-btn" data-speed="2">2×</button>
          <button type="button" class="speed-btn" data-speed="3">3×</button>
          <button type="button" class="speed-btn" data-speed="4">4×</button>
        </div>
        <button type="button" id="btn-pause" class="hud-chip" aria-pressed="false" aria-label="暂停" title="暂停">暂停</button>
        <button type="button" id="btn-hud-menu" class="hud-chip ghost" aria-label="返回选难度" title="返回选难度">选关</button>
        <button type="button" id="btn-audio" class="hud-audio" aria-pressed="false" aria-label="音乐开启，点击静音" title="点击静音">音乐</button>
      </div>
    </header>

    <main id="stage-wrap">
      <canvas id="game" width="400" height="600"></canvas>
      <div id="toast" class="hidden"></div>
    </main>

    <aside id="panel">
      <div id="build-panel" class="panel-block">
        <div class="panel-title">城防建造</div>
        <div class="tower-btns">
          <button type="button" class="tower-btn" data-type="arrow" id="btn-arrow">
            <span class="tb-name">箭塔</span>
            <span class="tb-cost">50</span>
            <span class="tb-desc">快 · 单体</span>
          </button>
          <button type="button" class="tower-btn" data-type="cannon" id="btn-cannon">
            <span class="tb-name">炮塔</span>
            <span class="tb-cost">120</span>
            <span class="tb-desc">溅射</span>
          </button>
          <button type="button" class="tower-btn" data-type="frost" id="btn-frost">
            <span class="tb-name">霜塔</span>
            <span class="tb-cost">90</span>
            <span class="tb-desc">减速</span>
          </button>
        </div>
        <p class="hint">点空地筑塔 · 点城垛升级/拆卖</p>
      </div>

      <div id="select-panel" class="panel-block hidden">
        <div class="panel-title" id="sel-title">箭塔 Lv.1</div>
        <div class="sel-stats" id="sel-stats"></div>
        <div class="sel-actions">
          <button type="button" class="action-btn primary" id="btn-upgrade">升级</button>
          <button type="button" class="action-btn danger" id="btn-sell">卖掉</button>
          <button type="button" class="action-btn ghost" id="btn-deselect">取消</button>
        </div>
      </div>

      <div class="panel-block wave-block">
        <button type="button" class="action-btn wave-btn" id="btn-next-wave">开始第 1 波</button>
      </div>
    </aside>

    <div id="start-overlay">
      <div class="overlay-card start-card">
        <h2>路卫</h2>
        <p class="start-sub">Coinpath Defense · 1000 关战役</p>
        <div class="start-section-title">难度</div>
        <div id="start-diff-btns" class="diff-btns" role="group" aria-label="难度">
          <button type="button" class="diff-btn active" data-diff="patrol" title="血×1 速×1">巡城</button>
          <button type="button" class="diff-btn" data-diff="hold" title="血×1.25 速×1.08">固守</button>
          <button type="button" class="diff-btn" data-diff="blood" title="血×1.55 速×1.15 金+20">血战</button>
          <button type="button" class="diff-btn" data-diff="abyss" title="血×2 速×1.22 金+40 命15">绝境</button>
        </div>
        <div class="start-section-title">关卡 <span class="start-level-cap">（最高 <span id="start-level-max">1</span>）</span></div>
        <div class="level-row">
          <input type="number" id="start-level" min="1" max="1" value="1" inputmode="numeric" />
        </div>
        <p id="start-stage-hint" class="start-hint">地图阶 1</p>
        <button type="button" class="action-btn primary" id="btn-start-game">出征</button>
      </div>
    </div>

    <div id="pause-overlay" class="hidden">
      <div class="overlay-card pause-card">
        <h2>已暂停</h2>
        <p class="pause-msg">战斗已冻结 · 存档进度保留</p>
        <div class="end-actions">
          <button type="button" class="action-btn primary" id="btn-resume">继续</button>
          <button type="button" class="action-btn ghost" id="btn-pause-menu">返回选择难度</button>
        </div>
      </div>
    </div>

    <div id="overlay" class="hidden">
      <div class="overlay-card">
        <h2 id="end-title">胜利</h2>
        <p id="end-msg"></p>
        <ul id="end-stats"></ul>
        <div id="end-actions" class="end-actions">
          <button type="button" class="action-btn primary" id="btn-restart">重开本关</button>
          <button type="button" class="action-btn ghost" id="btn-menu">返回选择难度</button>
        </div>
      </div>
    </div>
  </div>
  <script src="audio.js?v=14"></script>
  <script src="game.js?v=14"></script>
</body>
</html>
